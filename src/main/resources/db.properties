db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/seller_rating_db
db.user=${DB_USERNAME}
db.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

